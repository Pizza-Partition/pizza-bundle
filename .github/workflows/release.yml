name: Build, test and release runtime
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build runtime, kernel and base initramfs with mature tools
        run: docker build --file Containerfile --tag pizza-runtime-builder .
      - name: Test scratch userspace and real WPE JavaScript
        run: docker run --rm --network none --shm-size 256m pizza-runtime-builder
      - name: Export tested runtime
        run: |
          mkdir -p dist kernel
          container=$(docker create pizza-runtime-builder)
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/out/." dist/
          docker cp "$container:/kernel/." kernel/
          docker cp "$container:/kernel-smoke.cpio.gz" kernel-smoke.cpio.gz
      - name: Boot base plus test application overlay under Linux 7.2.11
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          cat dist/pizza-base-x86_64.img kernel-smoke.cpio.gz > base-test.img
          timeout 300 qemu-system-x86_64 -machine q35 -accel tcg -cpu max -m 4096M -display none -serial stdio -monitor none -nic none -kernel kernel/vmlinuz -initrd base-test.img -append 'console=ttyS0 rdinit=/init panic=1' -no-reboot > kernel-smoke.log 2>&1 || { cat kernel-smoke.log; exit 1; }
          cat kernel-smoke.log
          grep -F 'PIZZA_BASE_READY:7.2.11-arch1-1' kernel-smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pizza-runtime-x86_64
          path: dist/
          if-no-files-found: error
      - name: Attest final archive
        if: startsWith(github.ref, 'refs/tags/v')
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/pizza-*.tar.gz
            dist/pizza-base-x86_64.img
            dist/vmlinuz
            dist/base.json
      - name: Publish tested release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ATTESTATION: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION" dist/attestation.json
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes
