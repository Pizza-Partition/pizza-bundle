name: Build, test and release runtime
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build with pacman and patchelf
        run: docker build --file Containerfile --tag pizza-runtime-builder .
      - name: Test isolated userspace and real WPE JavaScript
        run: docker run --rm --cap-add SYS_ADMIN --security-opt seccomp=unconfined --network none pizza-runtime-builder
      - name: Export tested runtime
        run: |
          mkdir -p dist
          container=$(docker create pizza-runtime-builder)
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/out/." dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pizza-runtime-x86_64
          path: dist/
          if-no-files-found: error
      - name: Attest final archive
        if: startsWith(github.ref, 'refs/tags/v')
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/pizza-runtime-x86_64.tar.gz
      - name: Publish tested release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ATTESTATION: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION" dist/attestation.json
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes
